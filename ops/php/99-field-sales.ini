; Field Sales production PHP overrides.
; Install for both PHP-FPM and CLI so queue/scheduler commands use the same limits.

expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M
max_execution_time = 120
upload_max_filesize = 6M
post_max_size = 8M
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
