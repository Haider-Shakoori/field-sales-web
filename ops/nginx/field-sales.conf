# Replace FIELD_SALES_DOMAIN before enabling this configuration.
# TLS paths assume Let's Encrypt/Certbot; use equivalent certificate paths if required.

server {
    listen 80;
    listen [::]:80;
    server_name FIELD_SALES_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name FIELD_SALES_DOMAIN;

    root /var/www/field-sales/current/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/FIELD_SALES_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/FIELD_SALES_DOMAIN/privkey.pem;

    client_max_body_size 8m;

    access_log /var/log/nginx/field-sales.access.log;
    error_log /var/log/nginx/field-sales.error.log warn;

    location = /up {
        access_log off;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /ready {
        access_log off;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_read_timeout 120s;
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(?:env|log|sql|sqlite|bak)$ {
        deny all;
    }
}
