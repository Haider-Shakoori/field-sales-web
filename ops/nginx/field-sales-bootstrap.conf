# Temporary HTTP configuration for first deployment and ACME certificate issuance.
# Replace FIELD_SALES_DOMAIN, enable this file, deploy the application, then obtain
# the certificate before switching to ops/nginx/field-sales.conf.

server {
    listen 80;
    listen [::]:80;
    server_name FIELD_SALES_DOMAIN;

    root /var/www/field-sales/current/public;
    index index.php;

    client_max_body_size 8m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }

    location ~ /\. {
        deny all;
    }
}
