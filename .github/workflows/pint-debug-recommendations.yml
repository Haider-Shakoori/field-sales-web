name: pint-debug-recommendations
on:
  push:
    branches:
      - feat/ai-recommendations-morning-briefing

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: composer install --no-interaction --prefer-dist
      - name: Show Pint diff
        run: |
          vendor/bin/pint app/Services/AiInsightToolService.php app/Services/AiRecommendationService.php app/Services/ManagerBriefingService.php
          git diff -- app/Services/AiInsightToolService.php app/Services/AiRecommendationService.php app/Services/ManagerBriefingService.php
