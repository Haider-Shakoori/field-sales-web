name: web-css

on:
  push:
  pull_request:

jobs:
  css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build production CSS
        run: npm run build:css

      - name: Upload compiled CSS
        uses: actions/upload-artifact@v4
        with:
          name: fieldpulse-web-css
          path: public/css/app.css
          if-no-files-found: error
          retention-days: 7

      - name: Verify compiled CSS is committed
        run: git diff --exit-code -- public/css/app.css
