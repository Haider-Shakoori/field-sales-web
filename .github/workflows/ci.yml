name: web-ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

      - name: Validate operations scripts
        shell: bash
        run: bash -n ops/scripts/*.sh

      # The repository predates strict Pint enforcement and main still contains
      # formatting debt. Enforce Pint for every PHP file changed by the current
      # push/PR so new batches cannot add more debt while old files are cleaned
      # incrementally when touched.
      - name: Pint changed PHP files
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA="$(git rev-parse "$GITHUB_SHA^" 2>/dev/null || true)"
          fi

          if [ -n "$BASE_SHA" ]; then
            PHP_FILES="$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" -- '*.php')"
          else
            PHP_FILES="$(git ls-files '*.php')"
          fi

          if [ -n "$PHP_FILES" ]; then
            printf '%s\n' "$PHP_FILES"
            vendor/bin/pint app/Services/DailyRoutePlannerService.php
            echo "----- PINT AUTO-FIX DIFF -----"
            git diff -- app/Services/DailyRoutePlannerService.php
            exit 1
          else
            echo "No changed PHP files to lint."
          fi
