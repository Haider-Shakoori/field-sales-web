name: web-ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

      # The repository predates strict Pint enforcement and main still contains
      # formatting debt. Enforce Pint for every PHP file changed by the current
      # push/PR so new batches cannot add more debt while old files are cleaned
      # incrementally when touched.
      - name: Pint changed PHP files
        shell: bash
        run: |
          PHP_FILES="$(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- '*.php')"

          if [ -n "$PHP_FILES" ]; then
            printf '%s\n' "$PHP_FILES"
            printf '%s\n' "$PHP_FILES" | xargs vendor/bin/pint
            echo "=== PINT GENERATED DIFF ==="
            git diff -- '*.php'
            exit 1
          else
            echo "No changed PHP files to lint."
          fi
